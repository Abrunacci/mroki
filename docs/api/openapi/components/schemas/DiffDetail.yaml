type: object
title: DiffDetail
description: Diff content, and the diff config and shadow adapter snapshots used to compute it.
additionalProperties: false
required:
  - content
  - config
  - shadow_adapter
properties:
  content:
    type: array
    description: RFC 6902 JSON Patch operations describing the differences.
    items:
      $ref: "./PatchOp.yaml"
  config:
    $ref: "./DiffConfig.yaml"
  shadow_adapter:
    description: Shadow adapter and mapping version the diff was computed with, or null when none was used.
    oneOf:
      - $ref: "./DiffShadowAdapter.yaml"
      - type: "null"
