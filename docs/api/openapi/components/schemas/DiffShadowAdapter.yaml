type: object
title: DiffShadowAdapter
description: |
  The shadow adapter and mapping version a diff was computed with. When present,
  only the normalized bodies were compared (status codes and headers were not).
additionalProperties: false
required:
  - type
  - version
  - conversions
properties:
  type:
    type: string
    description: Adapter type.
    example: "graphql"
  version:
    type: string
    description: Version of the gate's mapping at computation time.
    example: "3f2a9c41d07b"
  conversions:
    type: array
    description: |
      Type conversions declared in the mapping and applied to the shadow body
      before diffing, in field order. Empty when none applied.
    items:
      $ref: "./FieldConversion.yaml"
